<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conserflow — SGI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f0f4f8;
  }

  header {
    background: #015D94;
    padding: 12px 24px;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  header img {
    height: 34px;
    width: auto;
  }

  header span {
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-left: 1px solid rgba(255,255,255,0.3);
    padding-left: 14px;
  }

  .wrapper {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 16px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 8px;
    box-shadow: 0 4px 24px rgba(1,93,148,0.15);
    display: block;
  }
</style>
</head>
<body>

<header>
  <img src="conserflow.png" alt="Conserflow">
  <span>Sistema de Gestión Integral</span>
</header>

<div class="wrapper">
  <iframe src="sgi.pdf#view=FitH&toolbar=1&navpanes=1&scrollbar=1" allowfullscreen></iframe>
</div>

</body>
</html>
