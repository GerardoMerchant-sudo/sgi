<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conserflow — Documentos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #015D94;
    --slate: #4E5862;
    --light: #f4f7fa;
    --white: #ffffff;
    --border: rgba(1,93,148,0.12);
    --shadow: 0 8px 40px rgba(1,93,148,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--light);
    min-height: 100vh;
    color: var(--slate);
  }

  /* ── HEADER ── */
  header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 0 48px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(1,93,148,0.06);
  }

  .logo {
    display: flex;
    align-items: center;
    text-decoration: none;
  }

  .logo img {
    height: 44px;
    width: auto;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--slate);
    opacity: 0.6;
  }

  .header-dot {
    width: 6px; height: 6px;
    background: #4CAF50;
    border-radius: 50%;
  }

  /* ── HERO ── */
  .hero {
    padding: 56px 48px 32px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .hero-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue);
    background: rgba(1,93,148,0.08);
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 20px;
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 44px;
    font-weight: 300;
    color: #0a1a2a;
    line-height: 1.15;
    margin-bottom: 12px;
  }

  .hero h1 span {
    color: var(--blue);
    font-weight: 600;
  }

  .hero p {
    font-size: 15px;
    color: var(--slate);
    opacity: 0.75;
    max-width: 460px;
    line-height: 1.6;
  }

  /* ── DIVIDER ── */
  .divider {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 48px;
  }

  .divider hr {
    border: none;
    border-top: 1px solid var(--border);
    margin-bottom: 36px;
  }

  /* ── GRID ── */
  .docs-grid {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 48px 64px;
  }

  /* ── CARD ── */
  .doc-card {
    background: var(--white);
    border-radius: 18px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    animation: rise 0.6s ease both;
  }

  .doc-card:nth-child(2) { animation-delay: 0.12s; }

  .doc-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 60px rgba(1,93,148,0.15);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    padding: 22px 24px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(1,93,148,0.03) 0%, transparent 60%);
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .pdf-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--blue), #0178bc);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .pdf-icon svg { fill: white; width: 18px; height: 18px; }

  .card-info h3 {
    font-size: 14px;
    font-weight: 500;
    color: #0a1a2a;
    line-height: 1.2;
  }

  .card-info span {
    font-size: 11px;
    color: var(--slate);
    opacity: 0.55;
    letter-spacing: 0.04em;
  }

  .badge {
    font-size: 10px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 100px;
    background: rgba(1,93,148,0.08);
    color: var(--blue);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* ── PDF VIEWER ── */
  .pdf-viewer-wrap {
    position: relative;
    background: #e8ecf0;
    height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .pdf-viewer-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* placeholder cuando no hay PDF */
  .pdf-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: linear-gradient(160deg, #edf1f6 0%, #e2e8ef 100%);
  }

  .placeholder-icon {
    width: 64px; height: 64px;
    background: rgba(1,93,148,0.10);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }

  .placeholder-icon svg { fill: var(--blue); width: 30px; height: 30px; opacity: 0.7; }

  .pdf-placeholder p {
    font-size: 13px;
    color: var(--slate);
    opacity: 0.5;
  }

  /* ── CARD FOOTER ── */
  .card-footer {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--border);
  }

  .card-footer-info {
    font-size: 12px;
    color: var(--slate);
    opacity: 0.5;
  }

  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--blue);
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 8px 18px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-download:hover {
    background: #01437a;
    transform: scale(1.03);
  }

  .btn-download svg { fill: white; width: 13px; height: 13px; }

  /* ── FOOTER ── */
  footer {
    background: var(--white);
    border-top: 1px solid var(--border);
    padding: 20px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  footer .foot-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--blue);
    opacity: 0.7;
  }

  footer .foot-copy {
    font-size: 12px;
    color: var(--slate);
    opacity: 0.4;
  }

  @media (max-width: 768px) {
    .docs-grid { grid-template-columns: 1fr; padding: 0 20px 48px; }
    .hero { padding: 36px 20px 24px; }
    header { padding: 0 20px; }
    .hero h1 { font-size: 32px; }
    .divider { padding: 0 20px; }
    footer { padding: 20px; }
  }
</style>
</head>
