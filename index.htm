<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conserflow — SGI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: Arial, sans-serif;
    background: #f0f4f8;
  }

  header {
    background: #015D94;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  header img {
    height: 40px;
    width: auto;
    /* El logo tiene fondo oscuro, se ve bien sobre azul */
  }

  header span {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    border-left: 1px solid rgba(255,255,255,0.3);
    padding-left: 14px;
    margin-left: 4px;
  }

  main {
    height: calc(100vh - 65px);
    padding: 20px;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 8px;
    box-shadow: 0 4px 24px rgba(1,93,148,0.15);
  }
</style>
</head>
<body>

<header>
  <img src="conserflow.png" alt="Conserflow">
  <span>Sistema de Gestión Integral</span>
</header>

<main>
  <iframe src="sgi.pdf"></iframe>
</main>

</body>
</html>
